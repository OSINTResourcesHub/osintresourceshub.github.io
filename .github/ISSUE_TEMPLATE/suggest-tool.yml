name: Suggest a tool or extension
description: Suggest an OSINT tool or browser extension for the Hub catalog
labels: ["suggest-tool"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a tool or extension. **Use its name as the issue title.**
        We keep the **URL** (a fact) and add our own category and health-check — we don't republish
        any source's structure, and we don't collect personal data. Please only suggest legitimate
        OSINT / research tools (no malware, no doxxing/harassment tooling).

        **Adding a browser extension?** Paste its store-page URL (Chrome Web Store, Firefox Add-ons,
        Edge Add-ons, Opera) and we'll tag it as an extension automatically.
  - type: input
    id: url
    attributes:
      label: URL
      description: The tool's homepage or repo — or a browser extension's store page.
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it does
      description: One or two lines — what it does and who it's for. Helps us categorize it.
      placeholder: Passive DNS lookups and sibling-domain discovery, for CTI analysts.
  - type: dropdown
    id: access
    attributes:
      label: Access
      description: Cost / access model — how much it costs to use.
      options:
        - Free
        - Partially free
        - Paid with trial
        - Paid
        - Unknown

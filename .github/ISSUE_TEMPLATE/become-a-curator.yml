name: Become a curator (coming soon)
description: Express interest in helping curate one of the OSINT Resources Hub topics.
title: "Curator interest"
labels: ["curator-interest"]
body:
  - type: markdown
    attributes:
      value: |
        We’re looking for curators for the eight topics on the site. No personal
        contact details are needed — your GitHub handle is enough to start the
        conversation. Share only what you’re comfortable making public.
  - type: dropdown
    id: topic
    attributes:
      label: Which topic would you like to help curate?
      options:
        - Cyber Intel
        - Corporate Intel
        - Fraud & Compliance
        - Geopolitics
        - Defence & Gov
        - Security Ops
        - Public Interest
        - Trust & Safety
        - Not sure yet / another area
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Relevant background
      description: A few lines on your OSINT experience and any public links (blog, GitHub, org). No email or phone needed.
      placeholder: e.g. "I verify open-source evidence for a newsroom; portfolio at ..."
    validations:
      required: false
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: I understand curation is voluntary and that I’m sharing only information I’m happy to make public.
          required: true
